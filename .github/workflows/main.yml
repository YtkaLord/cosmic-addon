name: Build Forge 1.16.5 Mod JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5.1'

      - name: Build Mod JAR (Forge 1.16.5-36.2.39)
        run: |
          if [ -f "build.gradle" ]; then
            gradle build --no-daemon
          elif [ -f "BetterLevelingCosmicAddon/build.gradle" ]; then
            cd BetterLevelingCosmicAddon && gradle build --no-daemon
          else
            BUILD_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
            cd "$BUILD_DIR" && gradle build --no-daemon
          fi

      - name: Upload Compiled JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betterleveling-cosmic-addon-1.16.5-1.0.0
          path: "**/build/libs/*.jar"
